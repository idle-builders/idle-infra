extensions:
  health_check:
    endpoint: 0.0.0.0:13133

  file_storage:
    directory: /var/lib/otelcol
    create_directory: true
    fsync: true
    # Leave room in the 256 MiB volume for BoltDB pages and compaction scratch.
    max_size: 201326592
    compaction:
      on_start: true
      on_rebound: true
      directory: /var/lib/otelcol/compaction
      cleanup_on_start: true
      rebound_needed_threshold_mib: 64
      rebound_trigger_threshold_mib: 16

  k8s_leader_elector:
    auth_type: serviceAccount
    lease_name: observability-collector
    lease_namespace: observability

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 4
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 4194304

  # Log rollout is deliberately narrow. Add one reviewed workload path and a
  # matching severity rule at a time; unknown severity remains retained.
  filelog/storage_broker:
    include:
      - /var/log/pods/infra_storage-broker-*_*/*/*.log
    start_at: end
    include_file_path: true
    max_log_size: 1MiB
    max_log_size_behavior: truncate
    storage: file_storage
    operators:
      - id: container
        type: container
        format: containerd
      - id: structured_json
        type: json_parser
        if: 'body matches "^\\{"'
        parse_from: body
        parse_to: body
        on_error: send
        severity:
          parse_from: body.level

  kubeletstats:
    collection_interval: 30s
    auth_type: serviceAccount
    endpoint: https://${env:K8S_NODE_IP}:10250
    insecure_skip_verify: true
    metric_groups: [node, pod, container, volume]

  k8s_cluster:
    auth_type: serviceAccount
    collection_interval: 60s
    k8s_leader_elector: k8s_leader_elector
    node_conditions_to_report: [Ready, MemoryPressure, DiskPressure, PIDPressure]
    allocatable_types_to_report: [cpu, memory, storage, ephemeral-storage]

  k8s_objects/events:
    auth_type: serviceAccount
    k8s_leader_elector: k8s_leader_elector
    include_initial_state: false
    objects:
      - name: events
        group: events.k8s.io
        mode: watch

  # These are explicit targets, not general annotation-based enrollment. Each
  # DaemonSet collector keeps only approved endpoints on its own node.
  prometheus/approved_endpoints:
    config:
      scrape_configs:
        - job_name: postgresql-approved
          scrape_interval: 60s
          scrape_timeout: 10s
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                names: [infra]
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_node_name]
              regex: ${env:K8S_NODE_NAME}
              action: keep
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
              regex: postgresql
              action: keep
            - source_labels: [__meta_kubernetes_pod_container_port_name]
              regex: http-metrics
              action: keep
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: '(pg_up|pg_settings_max_connections|pg_stat_database_(numbackends|xact_commit|xact_rollback|conflicts|deadlocks|temp_bytes)|pg_database_size_bytes|pg_replication_(is_replica|lag_seconds|last_replay_seconds)|up|scrape_duration_seconds|scrape_samples_scraped|scrape_samples_post_metric_relabeling)'
              action: keep
            - action: labelkeep
              regex: '(__name__|job|instance|datname)'

        - job_name: storage-broker-approved
          scrape_interval: 60s
          scrape_timeout: 10s
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                names: [infra]
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_node_name]
              regex: ${env:K8S_NODE_NAME}
              action: keep
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
              regex: storage-broker
              action: keep
            - source_labels: [__meta_kubernetes_pod_container_port_name]
              regex: metrics
              action: keep
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: '(storage_broker_requests_total|storage_broker_request_duration_seconds_(bucket|sum|count)|up|scrape_duration_seconds|scrape_samples_scraped|scrape_samples_post_metric_relabeling)'
              action: keep
            - action: labelkeep
              regex: '(__name__|job|instance|operation|outcome|le)'

        # Zitadel already exposes OpenTelemetry-backed Prometheus metrics on
        # its existing service port. Keep only the three public auth routes
        # and the aggregate latency histogram; arbitrary URI labels would let
        # request paths grow telemetry cardinality without bound.
        - job_name: zitadel-approved
          metrics_path: /debug/metrics
          scrape_interval: 60s
          scrape_timeout: 10s
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                names: [infra]
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_node_name]
              regex: ${env:K8S_NODE_NAME}
              action: keep
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
              regex: zitadel
              action: keep
            - source_labels: [__meta_kubernetes_pod_container_port_name]
              regex: http2-server
              action: keep
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: '(http_server_request_duration_seconds_(bucket|sum|count)|up|scrape_duration_seconds|scrape_samples_scraped|scrape_samples_post_metric_relabeling)'
              target_label: __tmp_keep
              replacement: 'true'
            - source_labels: [__name__, uri]
              regex: '(http_server_request_count_total|http_server_return_code_counter_total);(/oauth/v2/authorize|/oauth/v2/token|/oidc/v1/userinfo|)'
              target_label: __tmp_keep
              replacement: 'true'
            - source_labels: [__tmp_keep]
              regex: 'true'
              action: keep
            - action: labeldrop
              regex: __tmp_keep
            - action: labelkeep
              regex: '(__name__|job|instance|method|uri|return_code|le)'

        # ingress-nginx runs with --metrics-per-host=false and
        # --report-status-classes, so request series carry no client host and
        # only a status class. `path` is the Ingress rule path, not the request
        # URL. The request method is client-chosen, so series for anything but
        # the standard methods are dropped rather than given unbounded labels.
        # TLS ends at Cloudflare, so certificate-expiry series are not kept.
        # Exceeding sample_limit fails the whole scrape (up=0), which is the
        # intended visible gap rather than silently truncated evidence.
        - job_name: ingress-nginx-approved
          scrape_interval: 60s
          scrape_timeout: 10s
          sample_limit: 50000
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                names: [infra]
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_node_name]
              regex: ${env:K8S_NODE_NAME}
              action: keep
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_label_app_kubernetes_io_component]
              regex: ingress-nginx;controller
              action: keep
            - source_labels: [__meta_kubernetes_pod_container_port_name]
              regex: metrics
              action: keep
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: '(nginx_ingress_controller_requests|nginx_ingress_controller_(request|response|connect)_duration_seconds_(bucket|sum|count)|nginx_ingress_controller_config_last_reload_successful(_timestamp_seconds)?|nginx_ingress_controller_(success|errors)|up|scrape_duration_seconds|scrape_samples_scraped|scrape_samples_post_metric_relabeling)'
              action: keep
            - source_labels: [method]
              regex: '(|GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)'
              action: keep
            - action: labelkeep
              regex: '(__name__|job|instance|le|status|method|path|namespace|ingress|service|canary)'

        # cloudflared exposes its standard metrics on the fixed internal port
        # 2000. Registration-failure families carry raw error text as a label
        # and are not retained; dropped tunnel connections show as a lower
        # ha_connections value instead.
        - job_name: cloudflared-approved
          scrape_interval: 60s
          scrape_timeout: 10s
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                names: [infra]
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_node_name]
              regex: ${env:K8S_NODE_NAME}
              action: keep
            - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
              regex: cloudflared
              action: keep
            - source_labels: [__meta_kubernetes_pod_container_port_name]
              regex: metrics
              action: keep
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: '(cloudflared_tunnel_(ha_connections|total_requests|request_errors|response_by_code|concurrent_requests_per_tunnel|tunnel_register_success)|up|scrape_duration_seconds|scrape_samples_scraped|scrape_samples_post_metric_relabeling)'
              action: keep
            - action: labelkeep
              regex: '(__name__|job|instance|status_code|rpcName)'

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 96
    spike_limit_mib: 24

  k8sattributes:
    auth_type: serviceAccount
    filter:
      node_from_env_var: K8S_NODE_NAME
    extract:
      metadata:
        - k8s.namespace.name
        - k8s.pod.name
        - k8s.pod.uid
        - k8s.deployment.name
        - k8s.statefulset.name
        - k8s.daemonset.name
        - k8s.job.name
        - k8s.cronjob.name
        - k8s.node.name
        - service.namespace
        - service.name
        - service.version
    pod_association:
      - sources:
          - from: resource_attribute
            name: k8s.pod.uid
      - sources:
          - from: connection

  attributes/sanitize:
    actions:
      - pattern: '(?i)^http\.(request|response)\.header\..*$'
        action: delete
      - pattern: '(?i)(^|[._-])(authorization|cookie|password|passwd|secret|token|api[._-]?key|credential|session)([._-]|$)'
        action: delete
      - key: http.request.body
        action: delete
      - key: http.response.body
        action: delete
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set-cookie
        action: delete
      - key: url.query
        action: delete
      - key: db.query.text
        action: delete
      - key: db.statement
        action: delete
      - key: messaging.message.body
        action: delete

  # Resource attributes are a separate OTel map and are not affected by the
  # attributes processor above.
  resource/sanitize:
    attributes:
      - pattern: '(?i)^http\.(request|response)\.header\..*$'
        action: delete
      - pattern: '(?i)(^|[._-])(authorization|cookie|password|passwd|secret|token|api[._-]?key|credential|session)([._-]|$)'
        action: delete
      - key: url.query
        action: delete
      - key: db.query.text
        action: delete
      - key: db.statement
        action: delete

  # SeverityNumber 0 (UNSPECIFIED) is retained by design. This rule only drops
  # recognized storage-broker records below INFO.
  filter/log_level:
    error_mode: ignore
    logs:
      log_record:
        - 'resource.attributes["k8s.namespace.name"] == "infra" and resource.attributes["k8s.deployment.name"] == "storage-broker" and log.severity_number != SEVERITY_NUMBER_UNSPECIFIED and log.severity_number < SEVERITY_NUMBER_INFO'

  # Prometheus creates this metadata series after metric relabeling, so the
  # receiver allowlist cannot remove it.
  filter/prometheus_metadata:
    error_mode: ignore
    metrics:
      metric:
        - 'name == "scrape_series_added"'

  resource/collector:
    attributes:
      - key: collector.node.name
        value: ${env:K8S_NODE_NAME}
        action: upsert

connectors:
  # The main log pipeline drops recognized records below INFO. This parallel
  # accounting branch sees those records before the filter and emits only two
  # small metrics: excluded records and their serialized body bytes.
  signaltometrics/log_policy:
    error_mode: ignore
    logs:
      - name: observability.log.excluded.records
        description: Recognized log records excluded by the workload severity policy.
        conditions:
          - 'resource.attributes["k8s.namespace.name"] == "infra" and resource.attributes["k8s.deployment.name"] == "storage-broker" and log.severity_number != SEVERITY_NUMBER_UNSPECIFIED and log.severity_number < SEVERITY_NUMBER_INFO'
        sum:
          value: "1"
          monotonic: true
      - name: observability.log.excluded.body_bytes
        description: Serialized body bytes excluded by the workload severity policy.
        conditions:
          - 'resource.attributes["k8s.namespace.name"] == "infra" and resource.attributes["k8s.deployment.name"] == "storage-broker" and log.severity_number != SEVERITY_NUMBER_UNSPECIFIED and log.severity_number < SEVERITY_NUMBER_INFO'
        sum:
          value: 'Len(String(log.body))'
          monotonic: true

exporters:
  awss3/logs:
    s3uploader:
      endpoint: ${env:S3_ENDPOINT}
      region: ${env:S3_REGION}
      s3_bucket: ${env:S3_BUCKET}
      s3_base_prefix: raw/v1/logs
      s3_prefix: unknown-node
      s3_partition_format: date=%Y-%m-%d/hour=%H/minute=%M
      s3_partition_timezone: UTC
      file_prefix: logs
      s3_force_path_style: true
      compression: gzip
      retry_mode: standard
      retry_max_attempts: 3
      retry_max_backoff: 20s
    resource_attrs_to_s3:
      s3_prefix: collector.node.name
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue: &durable_queue
      enabled: true
      storage: file_storage
      num_consumers: 1
      sizer: bytes
      # Three signal queues share the file store: 3 x 48 MiB = 144 MiB.
      queue_size: 50331648
      batch:
        flush_timeout: 1m
        sizer: bytes
        min_size: 1048576
        max_size: 8388608
    timeout: 30s

  awss3/metrics:
    s3uploader:
      endpoint: ${env:S3_ENDPOINT}
      region: ${env:S3_REGION}
      s3_bucket: ${env:S3_BUCKET}
      s3_base_prefix: raw/v1/metrics
      s3_prefix: unknown-node
      s3_partition_format: date=%Y-%m-%d/hour=%H/minute=%M
      s3_partition_timezone: UTC
      file_prefix: metrics
      s3_force_path_style: true
      compression: gzip
      retry_mode: standard
      retry_max_attempts: 3
      retry_max_backoff: 20s
    resource_attrs_to_s3:
      s3_prefix: collector.node.name
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue: *durable_queue
    timeout: 30s

  awss3/traces:
    s3uploader:
      endpoint: ${env:S3_ENDPOINT}
      region: ${env:S3_REGION}
      s3_bucket: ${env:S3_BUCKET}
      s3_base_prefix: raw/v1/traces
      s3_prefix: unknown-node
      s3_partition_format: date=%Y-%m-%d/hour=%H/minute=%M
      s3_partition_timezone: UTC
      file_prefix: traces
      s3_force_path_style: true
      compression: gzip
      retry_mode: standard
      retry_max_attempts: 3
      retry_max_backoff: 20s
    resource_attrs_to_s3:
      s3_prefix: collector.node.name
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue: *durable_queue
    timeout: 30s

service:
  extensions: [health_check, file_storage, k8s_leader_elector]
  telemetry:
    resource:
      collector.node.name: ${env:K8S_NODE_NAME}
    logs:
      level: info
      encoding: json
    metrics:
      level: normal
      readers:
        - periodic:
            interval: 30000
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://127.0.0.1:4318
  pipelines:
    logs:
      receivers: [otlp, filelog/storage_broker, k8s_cluster, k8s_objects/events]
      processors: [memory_limiter, k8sattributes, attributes/sanitize, resource/sanitize, filter/log_level, resource/collector]
      exporters: [awss3/logs]
    logs/storage_broker_accounting:
      receivers: [filelog/storage_broker]
      processors: [memory_limiter, k8sattributes, attributes/sanitize, resource/sanitize, resource/collector]
      exporters: [signaltometrics/log_policy]
    metrics:
      receivers: [otlp, prometheus/approved_endpoints, kubeletstats, k8s_cluster, signaltometrics/log_policy]
      processors: [memory_limiter, filter/prometheus_metadata, k8sattributes, attributes/sanitize, resource/sanitize, resource/collector]
      exporters: [awss3/metrics]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, k8sattributes, attributes/sanitize, resource/sanitize, resource/collector]
      exporters: [awss3/traces]
