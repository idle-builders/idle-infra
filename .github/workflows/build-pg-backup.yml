name: Build pg-backup image

on:
  push:
    branches:
      - main
    paths:
      - "docker/pg-backup/**"
      - "scripts/check-ghcr-pull.sh"
      - ".github/workflows/build-pg-backup.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docker/pg-backup/**"
      - "scripts/check-ghcr-pull.sh"
      - ".github/workflows/build-pg-backup.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: idle-builders/idle-infra/pg-backup

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: docker/pg-backup
          push: ${{ github.event_name == 'push' }}
          labels: |
            org.opencontainers.image.source=https://github.com/idle-builders/idle-infra
            org.opencontainers.image.description=PostgreSQL backup image for platform infra
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:18.4-alpine3.22
